# Customization surface for gds-engine-godot-4.
#
# Override files (not edited here):
#   {project-root}/_bmad/custom/gds-engine-godot-4.toml         (team)
#   {project-root}/_bmad/custom/gds-engine-godot-4.user.toml    (personal)
