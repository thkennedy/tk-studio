# Customization surface for tk-studio-launch.
#
# Override files (not edited here):
#   {project-root}/_bmad/custom/tk-studio-launch.toml         (team)
#   {project-root}/_bmad/custom/tk-studio-launch.user.toml    (personal)

# Model/effort defaults (AD-14). Precedence: runtime override > project config
# > this resource default. The only LLM work this surface does is the studio
# pipeline's planner-tier leg — distilling the epic SPEC and breaking the
# first story into dispatchable tasks — so it sits on the planner tier by
# rule; execution-tier work happens inside the engine's sessions, not here.
# A project that must conserve budget pins a lower model in its config.
[model]
default = "claude-fable-5-1"
effort = "high"

# ---------------------------------------------------------------------------
# Execution-pipeline legs — the model and effort each role of a bmad-loop run
# uses (resource-default tier of AD-14 for the substrate; `lib/pipeline.py`
# resolves runtime `--set` > the project's `.bmad-loop/routing.toml` > this
# table and writes the result where the engine reads it).
#
# These are MEASURED defaults, not guesses ("pipeline v2", 2026-09-11..13,
# 25 stories on a C#/Godot game project; see kb/execution-pipeline-model-
# routing.md for the numbers). The shape that held: a mid-tier session that
# MONITORS and never decides; mid-tier implementer and reviewers; the top
# execution tier consulted only on objective triggers and for the pre-dispatch
# seam check; the post-hoc supervisor pass conditional and cheap. Result:
# about 3–4x cheaper per landed story than an Opus session with an Opus pass,
# every story landing on attempt 1, with the attended cost moved to planner
# seams rather than dollars.
#
# Legs (bmad-loop stage in parentheses where one exists):
#   session      (adapter.dev)    the dev session — a monitor: follows the
#                                 workflow, launches subagents, integrates,
#                                 verifies, writes the spec; consults, never rules
#   implementer                   the coding subagent the session launches
#   reviewers                     the review-hunter subagents (one layer for an
#                                 S-band story, two otherwise)
#   consult                       a subagent launched on an objective trigger only
#                                 (`[pipeline.consult] triggers`); rules within
#                                 scope; every ruling logged
#   seam                          the read-only pre-dispatch check of the NEXT
#                                 story's pinned files / signatures / tests
#                                 against the tree (dispatch | text-fix | escalate)
#   review       (adapter.review) bmad-loop's follow-up review session (projects
#                                 that keep it enabled; the inline layers are the
#                                 review by default)
#   triage       (adapter.triage) bmad-loop sweep / triage / resolve sessions
#   supervise                     the post-hoc supervisor pass — only on a DRIFT
#                                 line, an engine-directory touch, or an escalation
#   planner                       the attended planning session (a fresh session
#                                 per quiet point; never a subagent)
#
# Subagent legs (implementer, reviewers, consult) declare no `effort` here:
# `pipeline.py resolve` gives them the session's resolved effort (source
# `inherited-session`) unless a tier declares one, and the session passes it
# to the Agent tool explicitly on every launch.
#
# `advisor` (every leg): `opus | fable | off` (missing = off). On an engine
# stage leg (session, review, triage) a value other than `off` adds
# `--advisor <value>` to that stage's `claude -p` command line; on a subagent
# leg it reaches the subagent as its prompt's `Advisor:` first line. Pairing
# rule: the advisor must rank at or above the leg's model (fable > opus >
# every other model); a violation refuses by name. Shipped `off` on every leg
# (AD-14) until Epic 24.4 records a verdict.
#
# Model ids, efforts and advisors are validated by `pipeline.py check`; an
# unknown value refuses, never guesses.
[pipeline.legs]
session     = { model = "claude-sonnet-5", effort = "medium", advisor = "off", skill = "bmad-build-auto" }
implementer = { model = "claude-sonnet-5", advisor = "off" }
reviewers   = { model = "claude-sonnet-5", advisor = "off" }
consult     = { model = "claude-opus-5",   advisor = "off" }
seam        = { model = "claude-opus-5",   effort = "medium", advisor = "off" }
review      = { model = "claude-opus-5",   effort = "high", advisor = "off" }
triage      = { model = "claude-opus-5",   effort = "high", advisor = "off" }
supervise   = { model = "claude-sonnet-5", effort = "low", advisor = "off" }
planner     = { model = "claude-fable-5-1", effort = "high", advisor = "off" }
# Story 34.3: the host leg's screenshot judge (`tk-studio-playable-judge`,
# a `claude -p` session on the project's sandbox tier over the frames only).
playable-verify = { model = "claude-sonnet-5", effort = "medium", advisor = "off" }

# The objective triggers on which the session may consult, and the ruling's
# scope. Never launched on judgment alone; a project may narrow or extend the
# list in its `.bmad-loop/routing.toml` `[consult]` table.
[pipeline.consult]
triggers = [
  "verify-red",               # the verify gate is red after the implementer's own fix attempt
  "halt",                     # the session is about to HALT blocked
  "deviation-gt-0",           # the implementer reports a deviation score above 0
  "high-severity-finding",    # a review finding the session would grade high
  "tripwire",                 # a size or cost tripwire line the session must act on
  "seam-text-fix",            # a seam-check text fix conflicts with what the tree shows
  "file-outside-files",       # a file outside the story's Files list was or would be touched
]
scope = "resolve a contradiction between pinned facts; choose between two readings of the story; accept or reject a deviation. Never a design number, a product behaviour, or an architecture invariant — those return `escalate` and the session HALTs (CRITICAL stays human). Schema shape for an artifact a later story or an operator produces is a planner matter, settled in the SPEC's design notes, when the design documents constrain it; an operator ruling (`escalate`) only when they do not."
log = "spec `## Consult Log` entry + one observation event (tk-studio-observe, source `other`, description prefixed `consult:`)"
