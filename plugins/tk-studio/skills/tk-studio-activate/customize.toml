# Customization surface for tk-studio-activate.
#
# Override files (not edited here):
#   {project-root}/_bmad/custom/tk-studio-activate.toml         (team)
#   {project-root}/_bmad/custom/tk-studio-activate.user.toml    (personal)

# Model/effort defaults (AD-14). Precedence: runtime override > project config
# > this resource default. Activation is a mechanical read-only check — keep it
# cheap.
[model]
default = "claude-haiku-4-5"
effort = "low"
