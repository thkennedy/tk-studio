- id: "36-3-a-paused-or-resumed-run-is-never-parked"
  title: "A Paused or Resumed Run Is Never Parked"
  description: >-
    I want every pause to have a bounded, recorded exit: the resume's stop re-arm routed
    by tier, the story's Jira block closed by the resume, a failed first render
    auto-resumed once, a paused sweep's stop retry bounded and its WIP kept out of the
    leg, a story-boundary refusal ending the run rather than parking it, a killed
    resumed engine's PR left a draft with its guard reason kept, and an engagement's cap
    or ask block closed by the owner's go, So that the operator path for a pause is the
    API, never a hand edit of the worktree or the issue (holes 95 and 101; AI-2's B2,
    B3; the retrospective's B3/B4 decided; DW-110, DW-115, DW-120, DW-121, DW-130;
