- id: "36-5-the-supervisors-own-faults"
  title: "The Supervisor's Own Faults"
  description: >-
    I want the supervisor to stop causing the blocks it then refuses to clear: a run
    that blocks before any engine starts releases the checkout lock and an `on_status
    [blocked]` stop skips a block of the supervisor's own making, the tick never
    respawns holds, `submit` refuses a sandbox-tier job whose target skill is absent
    from the skills store, a core's own `blocked` status lifts into the run state, the
    pin-restart bounded per sandbox with the engine sandbox's `/tmp` pruned at the pin,
    a pacer pass visible while it runs, and doctor reading a process-level end over the
    routine tee lines, So that the supervisor's own faults are recorded as its own and
    never cost a hand-deleted lock row, a 1.26 USD host claim or 133 hold events (holes
    90, 94, 98; DW-105, DW-109, DW-113, DW-38; DW-55, DW-56, DW-58, DW-60, DW-63).
