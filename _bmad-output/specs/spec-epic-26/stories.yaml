- id: "26-1-launch-ends-every-path-with-the-block-and-owns-its-bootstrap"
  title: "Launch Ends Every Path with the Block and Owns Its Bootstrap"
  description: >-
    I want `tk-studio-launch` to end every headless path with the status block, to
    commit its own bootstrap output, and to check the engine's budget limits against the
    bands before it starts, So that a driver never records a missing block for a run
    that succeeded, a second launch pass is never needed, and no story runs under a
    policy limit the bands do not cover (holes 10, 20 and 4). Canonical: ST-088.
