    (the paragraphs under "## Epic 26:") for scope, rulings and the repo the story
    targets; transcribe the story into the spec's intent contract and never re-derive,
    generalise or extend it. Plan: plans/26-1.md when present (its Code Map is the
    investigation). Project rules and the verify gate: the studio customization
