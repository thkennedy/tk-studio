- id: "27-1-every-run-gets-its-own-worktree-and-ends-in-a-pr"
  title: "Every Run Gets Its Own Worktree and Ends in a PR"
  description: >-
    I want each run to work in a git worktree of the project cut from its base, and to
    end as a pull request against that base, So that two loops never share a working
    tree, a run never switches the branch under a running service, and all agent work
    arrives PR-only (hole 16; supersedes Story 23.2).
