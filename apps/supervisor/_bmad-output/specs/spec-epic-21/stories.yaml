- id: "21-6-a-killed-run-resumes-or-ends-partial-never-lost"
  title: "A Killed Run Resumes or Ends Partial, Never Lost"
  description: >-
    I want a run interrupted by a supervisor crash or a silent worker exit to resume
    from its transcript or end `partial` with the reason named, So that acceptance (c)
    holds: no run is ever silently lost. Canonical: ST-006.
  invoke_dev_with: >-
    Story text: _bmad-output/planning-artifacts/epics.md, section "### Story 21.6: A
    Killed Run Resumes or Ends Partial, Never Lost", the authoritative specification
    (user story and acceptance criteria). Read the epic's own narrative (the paragraphs
    under "## Epic 21:") for scope, rulings and the repo the story targets; transcribe
    the story into the spec's intent contract and never re-derive, generalise or extend
    it. Plan: plans/21-6.md when present (its Code Map is the investigation). Project
    rules and the verify gate: the studio customization
    (_bmad/custom/bmad-build-auto.toml). Routing: .bmad-loop/routing.current.json; pass
    implementer.model and reviewers.model explicitly on every subagent launch.
    Deviations: one `DRIFT: <what> - <why> - affects: <keys|none>` line each in the Auto
    Run Result.
    Replan (21-1 reconcile, 2026-09-28; the 2s wording superseded per 21-3 consult
    10:52:44Z): one-shot runs are minted by `submit`, recurring ones by `wake`. Resume
    and orphan handling adopt a studio run only if it is absent from the pre-verb
    snapshot stored at `verb_started` and was minted at or after `verb_started`. The
    earliest wins, and an ambiguous lookup fails.
    Replan (21-3 reconcile, 2026-09-28): resume extends `Queue.recover({end, find})`
    and its owner identity (hostname + pid + nonce + start time). The queue run id and
    `studio_run_id` stay separate. DW-3 is this story's: a worker that outlives a killed
    supervisor must hold the checkout lock, or be killed, before `recover` releases it.
    Replan (21-4 reconcile, 2026-09-28): "the same tier" means the queue run's stored
    `tier`/`sandbox`/`model`/`effort`. Rebuild `Started` through `validate()` so
    `registryRoot` (the sbx VM root, passed as `invokeSkill(…, {vmHostRoot})`) never
    falls back to the caller root. An sbx run's session transcript is inside the
    microVM.
    Replan (21-5 reconcile, 2026-09-28): a resume drives through 21-5's guards: the
    remaining wall-clock budget through `wallClockGuard` (on sbx the in-VM `timeout`
    in `buildSbxCommand`), `account` after the resumed iteration, and a trip ends
    `partial` naming the guard. Every end `recover` writes goes through `Queue.end`'s
    `stop` option with `studio_outcome`, so a restart-ended run matching
    `stop.on_status` records `stopped` (closes DW-8). DW-3's kill of the recorded
    worker pid/process group before `recover` releases the lock must also cover what
    `runProcess`'s signal handling misses (DW-7: SIGHUP under `nohup` or on non-Linux
    POSIX, SIGKILL, a crash). Keep `Queue.pacing()`'s `live`/`adoptable` view true
    for a resumed run.
