    Replan (21-3 reconcile, 2026-09-28): API run ids are queue run ids. Answers also
    carry `studio_run_id`. Cancel ends the queue run `cancelled` through a `Queue.end`
    transition with its event, and the studio run through `jobrun cancel` or launch
