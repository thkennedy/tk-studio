- id: "22-1-the-api-answers-on-the-tailnet-only"
  title: "The API Answers on the Tailnet Only"
  description: >-
    I want the supervisor's HTTP API on the tailnet address behind a bearer token, So
    that I can submit, watch, and cancel runs from the phone, iPad, or main PC.
    Canonical: ST-007.
  invoke_dev_with: >-
