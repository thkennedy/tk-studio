    `validate()` on any drive.
    Replan (21-6 reconcile, 2026-09-28): `/events` and `/runs/{id}` pass event kinds and
    details through as stored, never a fixed list (new kinds: `accounted`, `woke`,
    `session`, `worker`, `recovering`, `lock-released`). A `POST /jobs` on a checkout
    whose lock an ended run still keeps waits in `queued` naming that holder. Cancel
