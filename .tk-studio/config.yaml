# tk-studio project configuration — tracked, shared with the team (AD-15).
# Machine paths and credentials never land here (AD-3); per-dev values go in
# config.local.yaml (ignored). Resolution: runtime > config.local.yaml > this
# file > ~/.tk-studio/config.yaml > studio defaults shipped with the plugin.

# Stable project identity for the registry (AD-20); defaults to the repo
# basename. Required explicitly when two projects would share a basename.
# project_id: my-project

# Version control this project's team-shared data binds to (AD-18): git | perforce
vcs: git

# planning:
#   # Planning backend binding (AD-4): bmad-files | backlog-md | jira.
#   # Unset, the studio default applies (backlog-md).
#   backend: backlog-md

# Role-keyed working sets (AD-17) — recorded only on explicit confirmation
# by tk-studio-onboard (ST-4.3); no role's entry overwrites another's.
# working_set:
#   developer:
#     - resource-name

# Per-project job instances (AD-10; Epic 6). run-epic-28 (2026-10-17): Epic 28 through
# the supervisor's queue (POST /jobs), the first run-epic the service drives on this repository.
jobs:
  - research-ecosystem
  - run-epic-28
  - run-epic-29

# Role-keyed working sets (AD-17) — recorded only on explicit
# confirmation via tk-studio-onboard; one entry per role.
working_set:
  developer:
    - bmm
    - tea
    - bmb
    - bmad-loop
    - gds

# The host verify leg (supervisor Story 27.4): one command line the supervisor runs on the
# Windows host in a run's worktree before its PR opens, split on whitespace, never a shell.
# tk-studio's two gates (the lib suite and conformance, in two directories) live behind one
# argv-only entry point. Red ends the run partial and opens the PR as a draft naming the failures.
verify:
  host: uv run python tools/verify_host.py
