[project]
name = "tk-studio-cli"
version = "0.1.3"
description = "The tk-studio meta-CLI: installs and updates the studio from the committed roster (AD-21)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tk-studio = "tk_studio_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tk_studio_cli"]
